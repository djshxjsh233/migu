name: 自动刷新咪咕央视直播源

on:
  schedule:
    # 每 30 分钟刷新一次(咪咕 token 约 4 小时有效)
    - cron: '*/30 * * * *'
  workflow_dispatch:        # 手动触发
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 puppeteer-core
        run: npm install 2>&1 | tail -3

      - name: 安装 Chromium
        run: |
          sudo apt-get update -y
          sudo apt-get install -y chromium chromium-driver >/dev/null 2>&1
          echo "CHROME at: $(command -v chromium || command -v chromium-browser)"

      - name: 刷新直播源
        run: node refresh.js --timeout=60000
        env:
          CHROME_PATH: /usr/bin/chromium
          PUPPETEER_PATH: ./node_modules/puppeteer-core

      - name: 提交更新
        run: |
          git config user.name "migu-bot"
          git config user.email "actions@github.com"
          git checkout -B main
          git add -A
          if git diff --cached --quiet; then echo "无变化"; else git commit -m "自动更新直播源 $(date +'%Y-%m-%d %H:%M')"; git push origin HEAD:main; fi